<style>
/*@css:new(.amc-intro)*/
.amc-intro {
  padding: 0 60px;
}

.amc-intro-box {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 48px;
  max-width: 1200px;
  min-height: 500px;
  margin: 0 auto;
  padding: 56px 64px;
  border-radius: 32px;
  overflow: hidden;
  background: url('https://addmoments.com.ua/wp-content/uploads/2026/06/digital-memory-bg.png') no-repeat center center / cover, #e2e6f9;
}

.amc-intro-photos {
  position: relative;
  width: 100%;
  max-width: 470px;
  height: 400px;
}

.amc-intro-photo {
  position: absolute;
  border-radius: 30px;
  overflow: hidden;
  box-shadow: 0 14px 56px rgba(20, 20, 28, 0.18);
  transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}

.amc-intro-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.amc-intro-photo--back {
  width: 240px;
  height: 220px;
  top: 0;
  left: 190px;
  transform: rotate(4deg);
  z-index: 1;
}

.amc-intro-photo--front {
  width: 290px;
  height: 290px;
  top: 105px;
  left: 10px;
  transform: rotate(-7deg);
  z-index: 2;
}

.amc-intro-photo:hover {
  z-index: 3;
  box-shadow: 0 24px 70px rgba(20, 20, 28, 0.3);
}

.amc-intro-photo--back:hover {
  transform: translateY(-12px) rotate(3deg) scale(1.04);
}

.amc-intro-photo--front:hover {
  transform: translate(-8px, -8px) rotate(-9deg) scale(1.04);
}

.amc-intro-text {
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.amc-intro-title {
  max-width: 520px;
  font-size: 36px;
  letter-spacing: -1.5px;
}

.amc-intro-desc {
  max-width: 500px;
  font-size: 16px;
  line-height: 1.6;
  color: var(--amc-text);
}

@media (max-width: 1100px) {
  .amc-intro {
    padding: 0 32px;
  }

  .amc-intro-box {
    gap: 32px;
    padding: 48px 40px;
  }

  .amc-intro-title {
    font-size: 30px;
  }

  .amc-intro-photos {
    height: 320px;
  }

  .amc-intro-photo--back { width: 190px; height: 175px; left: 150px; }
  .amc-intro-photo--front { width: 230px; height: 230px; top: 85px; }
}

@media (max-width: 768px) {
  .amc-intro {
    padding: 0 16px;
  }

  .amc-intro-box {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    min-height: 0;
    padding: 36px 20px 28px;
    border-radius: 24px;
    background: #e2e6f9;
  }

  .amc-intro-title {
    font-size: 26px;
    letter-spacing: -1px;
  }

  .amc-intro-desc {
    font-size: 15px;
  }

  .amc-intro-photos {
    order: 2;
    width: 300px;
    height: 250px;
    margin: 0 auto;
  }

  .amc-intro-photo { transition: none; }
  .amc-intro-photo--back { width: 160px; height: 145px; left: 125px; }
  .amc-intro-photo--front { width: 190px; height: 190px; top: 60px; left: 5px; }
}
</style>
<section class="amc amc-intro" lang="{{lang}}">
  <div class="amc-intro-box">
    <div class="amc-intro-photos">
      <div class="amc-intro-photo amc-intro-photo--back">
        <img src="{{intro.img_back}}" alt="{{intro.img_back_alt}}" width="240" height="220" loading="lazy" decoding="async" />
      </div>
      <div class="amc-intro-photo amc-intro-photo--front">
        <img src="{{intro.img_front}}" alt="{{intro.img_front_alt}}" width="290" height="290" loading="lazy" decoding="async" />
      </div>
    </div>
    <div class="amc-intro-text">
      <h2 class="amc-heading amc-intro-title">{{intro.title}}</h2>
      <p class="amc-intro-desc">{{intro.text}}</p>
    </div>
  </div>
</section>

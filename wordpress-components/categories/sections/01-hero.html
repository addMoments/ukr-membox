<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" /></noscript>
<style>
/*@css:new(.amc-hero)*/
.amc-hero {
  position: relative;
  overflow: hidden;
}

.amc-hero-glow {
  position: absolute;
  width: 630px;
  height: 630px;
  right: -160px;
  top: -420px;
  border-radius: 50%;
  background: var(--amc-lime);
  opacity: 0.22;
  filter: blur(120px);
  pointer-events: none;
}

.amc-hero-inner {
  position: relative;
  max-width: 1320px;
  margin: 0 auto;
  padding: 16px 60px 80px;
}

.amc-crumbs ol {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  list-style: none;
  font-size: 13px;
  color: var(--amc-muted);
}

.amc-crumbs li {
  display: flex;
  align-items: center;
  gap: 8px;
}

.amc-crumbs a {
  text-decoration: none;
}

.amc-crumbs a:hover {
  text-decoration: underline;
}

.amc-crumbs svg {
  width: 12px;
  height: 12px;
}

.amc-crumbs [aria-current] {
  color: var(--amc-dark);
  font-weight: 500;
}

.amc-hero-title {
  margin-top: 40px;
  max-width: 780px;
  font-size: 52px;
  letter-spacing: -2.5px;
}

.amc-hero-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 40px;
  margin-top: 28px;
}

.amc-hero-sub {
  max-width: 560px;
  font-size: 16px;
  line-height: 1.6;
  color: var(--amc-text);
}

.amc-hero-actions {
  display: flex;
  gap: 12px;
  flex-shrink: 0;
}

@media (max-width: 1100px) {
  .amc-hero-inner {
    padding: 16px 32px 64px;
  }

  .amc-hero-title {
    font-size: 42px;
    letter-spacing: -2px;
  }

  .amc-hero-row {
    flex-direction: column;
    align-items: flex-start;
    gap: 28px;
  }
}

@media (max-width: 768px) {
  .amc-hero-inner {
    padding: 12px 16px 48px;
  }

  .amc-hero-title {
    margin-top: 28px;
    font-size: 30px;
    letter-spacing: -1px;
  }

  .amc-hero-sub {
    font-size: 15px;
  }

  .amc-hero-actions {
    flex-direction: column;
    width: 100%;
    max-width: 343px;
  }

  .amc-hero-actions .amc-btn {
    justify-content: space-between;
  }
}
</style>
<section class="amc amc-hero" lang="{{lang}}">
  <div class="amc-hero-glow" aria-hidden="true"></div>
  <div class="amc-hero-inner">
    <nav class="amc-crumbs" aria-label="{{hero.breadcrumb_label}}">
      <ol>
        <li>
          <a href="{{links.home}}">{{hero.breadcrumb_home}}</a>
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>
        </li>
        <li><span aria-current="page">{{hero.breadcrumb_current}}</span></li>
      </ol>
    </nav>
    <h1 class="amc-heading amc-hero-title">{{hero.title}}</h1>
    <div class="amc-hero-row">
      <p class="amc-hero-sub">{{hero.subtitle}}</p>
      <div class="amc-hero-actions">
        <a href="#events-list" class="amc-btn">
          {{hero.btn_choose}}
          <span class="amc-btn-icon"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.167 10h11.666M10 4.167L15.833 10 10 15.833" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </a>
        <a href="{{links.pricing}}" class="amc-btn amc-btn--outline">
          {{hero.btn_price}}
          <span class="amc-btn-icon"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M4.167 10h11.666M10 4.167L15.833 10 10 15.833" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
        </a>
      </div>
    </div>
  </div>
</section>
